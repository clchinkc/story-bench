# ---------------------------------------------------------------------------------
# Artificial Analysis frontier — provenance and method (owner-relevant, not admission)
# ---------------------------------------------------------------------------------
artificial_analysis:
  source: "https://artificialanalysis.ai/leaderboards/models"
  fetched: "2026-10-07"
  index: "Artificial Analysis Intelligence Index v4.3.2"
  index_components: "10 evals: AA-Briefcase v1.1, GDPval-AA v2.1, AutomationBench-AA, Terminal-Bench 4.0, SciCode, HLE, GDP.pdf, CritPt, AA-Omniscience, AA-LCR v1.1"
  price_basis: "price1mBlended0To3To1 = (3*input + output)/4, USD per 1M tokens, no cache"
  newest_model_release_in_page: "2026-10-06"
  what_this_index_is_not: >
    NONE of the ten components is narrative revision or continuity. This index is a
    cost/capability SELECTION AID for choosing which models to spend on. It is not a
    predictor of story-writing, not a literary ranking, and never a substitute for the
    study's own author judgements. docs/ai-evaluation-criteria.md already says model
    capability and cost are separate operational facts, not a universal ranking.
  prices_are_indicative: >
    AA prices are a selection aid only. The BINDING price for any model is the one
    W3b2 records from that route's own catalog and endpoint responses, with retained
    bytes and hashes. No envelope may be computed from an AA number.
  frontier_is_over_configurations_not_models: >
    AA lists one row per reasoning-effort variant AT THE SAME PRICE. Measured spread
    from the raw page: Claude Sonnet 5.5 Low 35.87 -> Max 56.00; Claude Fable 5.1 Low
    46.82 -> Max 53.35; GPT-6 Luna non-reasoning 18.47 -> Max 38.12. The effort setting
    is therefore a free variable worth up to ~20 index points, and an unpinned effort
    would make cross-model comparison meaningless.
  frontier_2026_10_07:
    - {label: "Claude Opus 5.5", lab: Anthropic, ii: 57.62, in: 4.00, out: 20.00, blend: 8.00, ctx: 1000000, open_weights: false}
    - {label: "Claude Sonnet 5.5", lab: Anthropic, ii: 56.00, in: 2.00, out: 10.00, blend: 4.00, ctx: 1000000, open_weights: false}
    - {label: "Muse Spark 1.3", lab: Meta, ii: 48.09, in: 1.25, out: 4.25, blend: 2.00, ctx: 1000000, open_weights: false}
    - {label: "MiMo-V2.6-Pro", lab: Xiaomi, ii: 46.32, in: 0.435, out: 0.87, blend: 0.5437, ctx: 1000000, open_weights: true}
    - {label: "GLM 5.3 Flash", lab: "Z AI", ii: 41.81, in: 0.15, out: 0.50, blend: 0.2375, ctx: 1000000, open_weights: true}
    - {label: "Qwen3.8-Flash-Next", lab: Alibaba, ii: 39.82, in: 0.15, out: 0.47, blend: 0.23, ctx: 256000, open_weights: true}
    - {label: "GPT-6 Luna", lab: OpenAI, ii: 38.12, in: 0.10, out: 0.50, blend: 0.20, ctx: 1000000, open_weights: false}
    - {label: "MiMo-V2.6-Flash", lab: Xiaomi, ii: 37.88, in: 0.14, out: 0.28, blend: 0.175, ctx: 1000000, open_weights: true}
    - {label: "K2 Horizon 375B A23B", lab: "Institute of Foundation Models", ii: 30.50, in: 0.00, out: 0.00, blend: 0.00, ctx: 524288, open_weights: true}
  labs_with_no_frontier_model: [Google, xAI, DeepSeek, Mistral, Amazon, Cohere, Moonshot]
  architecture_stratum_finding: >
    The SWA/SSM/linear-attention stratum CANNOT be populated at the frontier, with two
    exceptions: Qwen3.8-Flash-Next (on the frontier, hybrid Gated DeltaNet + sparse
    attention) and Kimi K3 (Moonshot, MoE + Kimi Delta Attention, II 43.59 at $6.00,
    dominated but competitive). Every other hybrid/SSM model catalogued above scores
    II 7-15 (Nemotron 12.86, Granite 14.83, Gemma 14.67, Ling 11.06, Kimi-Linear 7.30,
    Falcon-H1R 7.83). This is the evidence-backed answer to issue #1: the models
    TomLucidor named are real, and they are far off the frontier.

