# NOTHING IN THIS FILE IS ADMITTED. `admission_state: no_entry_admitted` is a fact,
# not a placeholder: W3b2 has qualified zero real routes, so no model here can be
# called, priced or run. This file exists so the roster question is answerable
# before the W6 freeze, and so an obsolete model cannot quietly stay in scope.
#
# Admission rule (from docs/provider-attempts.md and the W3b2 packet):
# a model enters a FROZEN roster only with a reproducible pinned route, retained
# first-party price/limit/finality evidence and the eight admission gates. A family
# name or an architecture label is never admission evidence.
#
# ROUTE FAMILY DECIDED 2026-10-07: the OpenRouter surface
# (https://openrouter.ai/api/v1, /chat/completions, USD) is the surface for every
# W3b2-qualified model. `src/provider_prices.py` already validates exactly that
# surface, so no scope amendment is needed; a candidate's route is its OpenRouter
# `<vendor>/<model>` id. Deciding the surface qualifies NOTHING — no entry here has
# genuine price/limit/finality/funding evidence, and each needs its own ceilings and
# its own conservative envelope before any paid dispatch.
#
# Provenance: every entry was compiled from a first-party page read on 2026-10-07.
# `architecture_evidence` is `stated` only when the source itself states the class,
# `inferred` when the class is derived from source text that does not label it, and
# `unverified` when no architecture statement was read.
