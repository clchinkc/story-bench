# W6 study preregistration — revision/continuity, D-minus-A.
#
# status: frozen, owner decision 2026-11-02. The three earlier blockers are closed: the roster is
# owner_approved, W3b2 has qualified nine real routes, and both run designs are declared below.
#
# Declaring both at once is deliberate and its cost is recorded (D026): `main_run` fixes the main
# sample size BEFORE the pilot that the contract says should justify it. The owner chose that over
# waiting, so the pilot measures variance, failure rates and real prices for a design already fixed.
# If it contradicts that design, the honest remedy is a new declaration — not a quiet reinterpretation
# of this one.
#
# Encodings: this file never carries story text, labels, credentials or prices.
schema_version: 1
study_id: revision-v1
kind: PREREGISTRATION
status: frozen

estimand:
  primary: "weighted mean within-cluster paired D-minus-A resolved difference"
  locale_weights: equal
  arm_control: A
  arm_treatment: D
  secondary_arms: [B, C]
  # Only `model` is an implemented stratum: the report emits descriptive per-model
  # lifts. Architecture class is a ROSTER annotation (config/study-roster-candidates.yaml),
  # not an analysis stratum here — claiming it as one would be decorative, which is
  # exactly what an independent review caught in the previous revision.
  strata: [model]

interval:
  method: hierarchical_paired_cluster_bootstrap
  seed: 20261007
  resamples: 10000
  confidence: 0.95

# OWNER-DECIDED pilot roster, 2026-10-07. `roster_status: owner_approved`.
#
# Shape: the Artificial Analysis Pareto frontier (Intelligence Index v4.3.2) plus the
# non-frontier mainstream flagships, plus the two competitive linear-attention models.
# Reasoning effort is pinned to Max for EVERY model: AA lists one row per effort variant
# at the SAME price, and the measured spread is up to ~20 index points (Sonnet 5.5 Low
# 35.87 -> Max 56.00), so an unpinned effort would make cross-model comparison
# meaningless.
#
# The labels are NOT route strings. Exact `model_id` / `canonical_model_slug` /
# `endpoint_tag` are W3b2 evidence read from each route's own catalog and endpoint
# responses. Approving the roster does not admit one model.
roster:
  # Nine labs, one officially hosted model each — owner decision 2026-10-31.
  # "Official" means the vendor's own namespace on OpenRouter. Flex tiers are excluded because only
  # some labs offer them, which would make service tier a function of lab.
  - Opus 5.5
  - Muse Wonder
  - GPT-6.1 Sol Pro
  - Grok 4.7
  - Qwen3.8 Max Prime
  - Gemini 4 Argon
  - Kimi K3.1 Pro
  - GLM 5.3
  - DeepSeek V4.1 Flash 1017
roster_status: owner_approved
reasoning_effort:
  # Owner decision 2026-10-31: each lab runs at ITS OWN highest supported effort, because three of the
  # nine cannot accept `max` at all. This is a declared treatment difference, not an oversight: it makes
  # effort a function of lab, which is the same confound that excluded the flex tier, and it is accepted
  # here deliberately so that every lab is measured at its own ceiling rather than excluded.
  # Verified against the 2026-10-31 catalog `reasoning.supported_efforts` per model.
  default: max
  per_model:
    "anthropic/claude-opus-5.5": max
    "meta/muse-wonder": max
    "openai/gpt-6.1-sol-pro": max
    "moonshotai/kimi-k3.1-pro": max
    "z-ai/glm-5.3": max
    "deepseek/deepseek-v4.1-flash-1017": max
    "x-ai/grok-4.7": xhigh          # ceiling: catalog offers xhigh/high/medium/low
    "qwen/qwen3.8-max-prime": xhigh # ceiling: catalog offers xhigh/high/medium/low/minimal
    "google/gemini-4-argon": high   # ceiling: catalog offers only high/medium/low
  note: "requesting an unsupported effort is denied by the adapter's own control, so three routes would have been unrunnable at `max`"
  # Added 2026-11-05 after a paid attempt. OpenRouter accepts ONE reasoning setting: `reasoning.effort`
  # and `reasoning.max_tokens` together are refused with HTTP 400. That forces a choice, and the
  # measurement made it: opus at `effort: max` with `max_tokens: 9000` spent 9,000 of 9,000 tokens
  # reasoning and returned `content: null`, twice, at $0.126 and $0.186 — a billed empty string is not
  # a measurement. The same harness at `effort: high` (gemini) produced 2,973 reasoning + 3,385 output.
  # Effort is a policy hint that does not terminate inside a budget; `max_tokens` is a hard split.
  # So `max` routes are sent a thinking budget, and every other route keeps its declared effort.
  request_encoding:
    cap_when_effort_is: [max]
    # A route whose declared effort does NOT terminate is capped too, whatever that effort is.
    # Measured, not assumed: at `xhigh`, x-ai/grok-4.7 produced 5,136 output tokens and finished,
    # while qwen/qwen3.8-max-prime spent all 9,000 completion tokens on reasoning and returned
    # `content: null` (outcome=truncated) -- so the discriminator is the route, not the effort word.
    cap_models: ["qwen/qwen3.8-max-prime"]
    rule: "declared effort in cap_when_effort_is -> reasoning.max_tokens = TASK_TOKEN_CONFIG[family].max_reasoning_tokens; otherwise -> reasoning.effort = the declared value"
    why: >
      The trade is explicit rather than hidden. A capped route is no longer asked, on the wire, for its
      highest effort; it is given the family's thinking budget, which is the only bound that leaves
      room to write. The declared `per_model` effort stays as the reason the cap is needed, and the
      admission gate's `effort` text states which of the two encodings the request actually carries, so
      the record cannot attest to a request that was never made. This is a treatment difference between
      labs and it is accepted for the same reason the per-model effort already is: excluding six of
      nine labs would be a larger distortion than encoding them differently.

roster_rationale: >
  Owner decision 2026-10-31 replaced a deliberately constructed roster with one that represents each
  lab at its frontier: nine labs, one officially hosted model each, chosen as the newest largest
  non-preview model by model version number, pinned to the vendor's own endpoint. This answers a
  different question from its predecessor and the difference is recorded rather than glossed. The
  previous roster existed to make three contrasts answerable — a blended cost envelope from USD 0.00
  to 8.00, nine flagships deliberately NOT on the frontier, and two linear-attention models for an
  architecture question without a capability confound. This roster CANNOT answer any of the three:
  every model is frontier, so the cost envelope collapses to the top of its range; nothing is chosen
  off-frontier; and no linear-attention model remains. Those questions are abandoned, not deferred.
  Two further facts the roster's shape follows rather than chooses: Z.ai is represented by glm-5.3 and
  not its flagship glm-5.3-prime, because the flagship has no z-ai endpoint; and Meta is represented
  by muse-wonder alone, because it is Meta's only officially hosted model. Precision is not held
  constant across labs: four pins are the vendor's quantised deployment and the rest declare
  quantization unknown, so cross-lab comparison mixes model and precision.

task_mix:
  status: declared 2026-11-01
  basis: >
    The reservation ceiling cannot be derived from the roster alone: "144 units x 2 arms" says how many
    arm-runs exist, not what each one costs, because `max_tokens` is fixed per task family. Leaving the
    mix undeclared forced every arm-run to be priced at the longest family, which was 114.82 of the
    hold. Declaring it here makes the ceiling DERIVED rather than assumed, and it is the single source
    both `scripts/mix_ceiling.py` and the dispatch gate read instead of carrying their own copies.
  weights_are: >
    the frozen task counts below, with the 144 units per model allocated proportionally, so each of the
    25 frozen tasks is used about 5.76 times per model per arm. The counts are read from
    `dataset/tasks/<family>/*.yaml`; a counting change is a mix change and must be re-declared.
  families:
    beat_interpolation: 5
    beat_revision: 5
    constrained_continuation: 4
    multi_beat_synthesis: 3
    theory_conversion: 4
    critique_improvement: 4
  max_tokens_by_family:
    beat_interpolation: 6000
    beat_revision: 6000
    constrained_continuation: 8000
    multi_beat_synthesis: 10000
    theory_conversion: 7000
    critique_improvement: 7000
  max_tokens_basis: >
    Must equal TASK_TOKEN_CONFIG in src/llm_client.py, which is the code SSOT and what actually caps a
    request. tests/test_task_mix.py asserts the equality, so a divergence fails the suite rather than
    silently mispricing the study.
  excluded_multicall:
    - agentic_constraint_discovery
    - agentic_planning_execution
    - agentic_iterative_revision
  excluded_reason: >
    These three are NOT in the mix and the omission is a correctness decision, not convenience.
    Agentic episodes make several model calls each: `agentic_iterative_revision` loops
    max_revisions and planning execution is plan plus execute, so pricing them at a single
    max_tokens would UNDERSTATE the hold — the one direction this arithmetic must never err in. If a
    later revision admits them, their per-episode call count must be bounded first.
  ceiling_consequence: >
    At these weights the gate's reservation ceiling is 294.21 (input held at the 8,000-byte profile
    ceiling), against 389.26 when every arm-run is priced at the longest family. Using each family's
    measured body instead of the 8,000 ceiling lowers it further to 274.44, but only the gate's
    conservative figure is funded. Recompute with `scripts/mix_ceiling.py`, which reads this block
    rather than carrying its own copy.

pilot_run:
  status: frozen
  units_per_model: 24
  arms: 2
  units_per_cluster: 4
  clusters_per_locale: 2
  locales: ["en", "zh-Hant", "zh-Hans"]
  basis: >
    Owner decision 2026-11-03: the pilot must COVER the declared mix, because its purpose is to
    validate the mix-based ceiling. 18 units drew only indices 0..5 and landed in 2 of the 6
    families. 25 -- one unit per frozen task -- is not composable with three locales under the
    runner's product form (25 is not divisible by 3), so the smallest configuration reaching all
    six families without dropping a locale is 24: 2 clusters x 4 units x 3 locales, covering
    indices 0..23, i.e. every family plus 3 of the 4 theory_conversion tasks. Cost rises from about
    USD 99 to about 132, still inside the 150 pilot envelope. Requesting exactly 25 would require
    locales: ["en"], which buys one more task and loses two locales -- a worse trade that this
    decision did not intend.

main_run:
  status: frozen
  units_per_model: 144
  arms: 2
  units_per_cluster: 3
  clusters_per_locale: 16
  locales: ["en", "zh-Hant", "zh-Hans"]
  basis: >
    16 clusters x 3 units x 3 locales = 144, the decided configuration, giving 2,592 arm-runs over the
    nine routes. The reservation against the declared mix is 294.21 and main is 324.

cost_estimate_indicative:
  basis: "catalog prices x 4 arms x (8000 input + 6000 output) tokens x units/model"
  basis_note: "the historical grid below is priced on FOUR arms at 288 units/model. A unit is a matched four-arm set, so units_per_model counts units and each carries four arm-runs; unit_cost multiplying by ARMS is therefore correct, not a double count."
  decided_configuration_2026_10_31:
    note: "owner decision 2026-10-31; the four-arm main study did not fit the cap"
    units_per_model: 144
    arms: 2
    generation_usd: 239.97
    power: 0.30
    critics_graders_at_1_5x_usd: 359.95
    programme_usd: 989.97
    spare_usd: 10.03
    retry_exposure: "retry_limits.max_retries 3 permits four attempts, so the conservative main bound is 479.94 against a 240 main allocation; the guard must REFUSE rather than overrun"
    arms_consequence: "B and C lose inferential status and become a diagnostic run; the primary estimand is computed on D minus A only"
  power_grid:
    - {clusters_per_locale: 10, units_per_cluster: 2, units_per_model: 60, power: 0.17, mean_95_width: 0.390, generation_usd: 330, with_critic_grading_retry_2_5x_usd: 826}
    - {clusters_per_locale: 16, units_per_cluster: 3, units_per_model: 144, power: 0.30, mean_95_width: 0.273, generation_usd: 793, with_critic_grading_retry_2_5x_usd: 1982}
    - {clusters_per_locale: 24, units_per_cluster: 4, units_per_model: 288, power: 0.58, mean_95_width: 0.199, generation_usd: 1585, with_critic_grading_retry_2_5x_usd: 3964}
    - {clusters_per_locale: 36, units_per_cluster: 5, units_per_model: 540, power: 0.63, mean_95_width: 0.148, generation_usd: 2973, with_critic_grading_retry_2_5x_usd: 7432}
  smallest_design_usd: {units_per_model: 18, generation_usd: 99, with_critic_grading_retry_2_5x_usd: 248}
  pilot_envelope_usd: 150
  main_envelope_usd: 400
  program_cap_usd: 1000
  finding: >
    The 18-configuration roster cannot support a POWERED main study inside the USD 1,000
    cap: the cheapest grid point reaching power ~0.58 costs USD 1,640 for generation alone,
    and power is a ceiling because the simulation covers the resolved gate only. The
    smallest design (18 units/model) costs USD 103 generation / USD 256 with critics.
  pre_dispatch_decision_required: >
    (a) narrow the MAIN-study roster while the pilot roster stays 18, (b) two arms for the
    main study (primary D-minus-A only, B/C demoted to a diagnostic) which halves the
    figures, (c) accept lower power and report precision limits, or (d) report pilot
    infeasibility. Contract sections 8 and 9 forbid relaxing a threshold after inspection,
    so this is decided before dispatch, and the binding prices are W3b2's, not these.
  concentration: >
    Three models (Claude Opus 5.5, GPT-6 Astra, claude-fable-5.1) are 57% of the
    generation estimate; the five sub-$0.50 models are 3% of it.
  endpoint_pin_effect: >
    These figures use the catalog top-level price. A model with several endpoints can
    differ by up to 12x, so the endpoint pin decided at W3b2 changes this arithmetic.
  endpoint_price_envelope_usd_per_unit_model: {cheapest_endpoint: 4.5108, top_level: 5.5052, dearest_endpoint: 14.4192}
  powered_row_bounds_usd:
    basis: "the cheapest grid row reaching power >= 0.5 (24 clusters/locale x 4 units/cluster = 288 units/model)"
    top_level_price: 1585
    cheapest_endpoint_price: 1299
    dearest_endpoint_price: 4153
  robustness: >
    The headline does not depend on which endpoint price is used: even the
    cheapest-endpoint bound ($1,299) exceeds the $1,000 cap. Reproduce with
    bindings/execution/w3b2/route-evidence-2026-10-07/check_cost_estimate.py, which
    reads the label->route binding from route-evidence.json rather than declaring it.
  rounding: >
    Published generation cells are whole USD; raw values are 330.31 / 792.75 / 1585.50 /
    2972.81 and 99.09 for the 18-unit design. The 2.5x column is derived from the raw
    value, so e.g. 2972.81 x 2.5 = 7432.02 rounds to 7432.
  concentration: >
    Three models (Claude Opus 5.5, GPT-6 Astra, claude-fable-5.1) are 66% of the
    generation estimate; the six sub-$0.50 models are 2% of it.

sample_size: 144

benefit_gate:
  observed_lift_gate: 0.10
  lower_bound_gate: 0.0

quality_safeguard:
  metric: "Q=(wins+0.5*ties)/valid_assessed_pairs"
  observed_gate: 0.50
  lower_bound_gate: 0.45

missingness:
  policy: "full assigned denominator; agent-caused absent counts unresolved; provider/infrastructure/grader-invalid excluded from the point estimate and bounded worst/best; no benefit verdict when the bound straddles the gate"
  report_full_denominator: true
  worst_best_bounds: true

valid_assessment:
  definition: "a unit is assessed when both A and D carry a task-assessable resolved outcome under the authority gates"
  unassessable_is_not_a_tie: true

judge:
  designated: "google/gemini-4-argon"
  qualification: "the judge is drawn from the same nine qualified routes that generate the outputs, because those are the only routes this study has qualified; no route outside the roster was qualified to judge, and qualifying one would be a second instrument bought with money this hold does not contain"
  confound_disclosure: >
    The judge is ALSO a generation subject: google/gemini-4-argon generates 48 of the 432 rows and
    judges, so its preference for its own prose cannot be separated from its prose being better.
    The overlap is not an accident of sampling and it cannot be removed by re-design, because the
    only qualified judge is one of the subjects. It is therefore DECLARED and carried into the
    analysis rather than argued away: every judgement is recorded with the overlap as evidence, and
    the estimand's primary contrast (D minus A, pooled across models) inherits a bias only through
    the judge's own 48 rows. The gemini-versus-others contrast is the one most exposed and is
    reported as such, not folded into the pooled number. A reader who does not accept this design
    fact should read the pooled estimate as conditional on a self-interested judge, and should give
    the per-model breakdown the weight instead.
  confound_affected_rows: 48

coverage_threshold: 0.90

retry_limits:
  max_retries: 3
  new_attempt_id_per_retry: true
  fixed_on_all_arms: true

stop_criteria:
  - "predeclared cap reached"
  - "frozen-version drift"
  - "holdout contamination"
  - "never stop on significance"

multiplicity:
  policy: "one primary gate; B/C and the interaction term are secondary and multiplicity-corrected; no post-hoc threshold relaxation and no model reselection after results"

power_simulation:
  baseline_rate: 0.55
  true_lift: 0.12
  cluster_sd: 0.12
  unassessable_rate: 0.06
  grid: [[10, 2], [16, 3], [24, 4], [36, 5]]

spend:
  ceiling_usd: 1000
  pilot_envelope_usd: 150
  note: "nominal headroom, not released allowance; direct USD 0 and reservations USD 0 today"
  allocations_2026_10_31:
    repair: 100
    data_judge: 500
    pilot: 150
    main: 240
    reserve: 10
    note: "data/judge raised 200 -> 500, funded by main 400 -> 240 and reserve 150 -> 10; the shift is explicit as contract section 9 requires"
    superseded_by: allocations_2026_11_01
  allocations_2026_11_01:
    repair: 100
    data_judge: 375
    pilot: 150
    main: 365
    reserve: 10
    total_usd: 1000
    note: "data/judge 500 -> 375, funding main 240 -> 365; five lines still sum to 1,000 and the programme total is unchanged at 989.97"
    reason: >
      The 2026-10-31 split was not self-consistent with contract section 9's own pre-dispatch
      paragraph, which requires a CONSERVATIVE UPPER BOUND reserved before every call and refusal
      when it would breach an envelope. The $239.96 figure is an EXPECTED cost (8,000 input /
      6,000 output per arm-run); the bound is not. At 144 units x 2 arms x 9 routes the proven
      worst case is $360.46 with output capped at the largest task max_tokens (10,000), and about
      $280 using each task's own max_tokens. A 240 main could therefore only have been satisfied
      by reserving the expected rather than an upper bound, i.e. by breaking the paragraph above.
      The reservation is a hold, not a spend: the excess returns at reconcile, and the expected
      generation cost stays 239.96. Verified against the nine qualified records, not re-estimated.
    bound_evidence: "260 arm-runs x 9 routes at 8,000 input / 10,000 output from each record's guarded price_components"
    superseded_by: allocations_2026_11_01_corrected
  allocations_2026_11_01_corrected:
    repair: 90
    data_judge: 360
    pilot: 150
    main: 390
    reserve: 10
    total_usd: 1000
    note: "repair 100 -> 90 and data/judge 375 -> 360 fund main 365 -> 390; five lines still sum to 1,000, programme unchanged at 989.97"
    reason: >
      The 365 above was derived from 360.46 and was WRONG by 28.80, in one line: gemini-4-argon
      declares reasoning_inclusive false and prices internal_reasoning separately, so its 10,000
      token reasoning bound is a real charge beside completion rather than inside it. The corrected
      bound, obtained by deriving all nine profiles from the retained records with
      build_verified_profiles.py rather than by hand, is 389.26. data/judge keeps 360 because
      critics cost about 1.5x the EXPECTED generation of 239.96, i.e. 359.94, and that line has to
      stay funded; repair gives up the 10 instead.
    bound_evidence: "build_verified_profiles.py over the nine retained records and verification artifacts"
    superseded_by: allocations_2026_11_01_lean
  allocations_2026_11_01_lean:
    repair: 90
    data_judge: 426
    pilot: 150
    main: 324
    reserve: 10
    total_usd: 1000
    note: "main 390 -> 324 once the mix is declared; the 66 returned goes to data/judge 360 -> 426"
    reason: >
      With the task mix declared the reservation ceiling falls from 389.26 to 294.21, so a 390 main
      would hold 95.79 idle against a 1,000 cap. main is set to the declared ceiling plus a 10 % retry
      allowance: 294.21 x 1.1 = 323.63, rounded to 324, leaving 29.79 for retries, about 29 retried
      arm-runs. 294.21 is the GATE's figure and it is deliberately the conservative one: the gate holds
      input at the 8,000-byte profile ceiling, while 274.44 is achievable only if each family's own
      measured body is used. The gate's number is the one that binds, so it is the one funded. The
      surplus returns to the critic/grading line, which was pinned at 360 for a 359.94 estimate and
      had no room to absorb a re-grade.
    bound_evidence: "scripts/mix_ceiling.py, reading task_mix above; dataset-weighted, measured input"
    superseded_by: allocations_2026_11_07_overshoot
  allocations_2026_11_07_overshoot:
    repair: 90
    data_judge: 200
    pilot: 150
    main: 800
    reserve: 10
    total_usd: 1250
    note: "owner decision 2026-11-07 (option B): cap 1,000 -> 1,250 so main can hold what the measurements require; main 800, data/judge 426 -> 200"
    bound_evidence: "dispatch_gate.py reservation 776.26 over route-evidence-2026-11-06"
    supersedes: allocations_2026_11_01_lean

critique_episode:
  # `critique_improvement` is NOT a single call, so its 72 rows are deferred rather than measured as
  # if one answer were an episode. The shape below is the harness's own
  # (`AgenticGenerator.run_critique_improvement`), restated here because the mix price currently
  # assumes one call per row and that assumption is wrong until this runner exists.
  rounds: 3
  calls_per_row: 7          # 1 initial + 3 x (critique, revision)
  subject_calls: 4
  critic_calls: 3
  critic_route: "google/gemini-4-argon"
  critic_budget: >
    The critic gets the SAME max_tokens as the subject, and the first paid turn is why: a separate
    1,500-token critic cap was tried, gemini at `effort: high` spent 1,497 of it thinking and returned
    zero characters (`outcome: truncated`, $0.0177 for an empty critique). Under `effort` the thinking
    shares `max_tokens` with the answer, so a cap sized for "just a critique" is a cap sized for
    nothing. The prompt asks for feedback rather than a rewrite; the budget belongs to the route.
  critic_rule: >
    The critic is a SECOND model, never the subject: asking a model to critique its own draft
    measures self-agreement, not responsiveness to criticism. It is the study's designated judge
    route because that is the only other qualified route the programme already pays for, and the
    consequence is disclosed rather than hidden: the route that critiques the revision also scores
    it, so a critique that is merely agreeable will look like an improvement. The judge-subject
    confound in `judge.confound_disclosure` therefore extends to this family, and the
    improvement-trajectory estimand is reported as conditional on it.
  state_machine: "scripts/critique_episode.py: next_turn(task, transcript, rounds, builder)"
  budget_consequence: >
    The declared mix prices every arm-run at one call. Until the runner exists, the 72
    critique_improvement rows are EXCLUDED from any run (pilot_run --family omits them) and the
    reservation does not cover them. Admitting them multiplies their cost by seven and requires a
    re-priced `allocations_*` block; that is why they are deferred rather than quietly run.
