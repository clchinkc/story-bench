[project]
name = "story-bench-scripts"
version = "0.1.0"
requires-python = "==3.14.5"
dependencies = [
  "openai>=1.0",
  "httpx>=0.25",
  "pyyaml>=6",
  "jsonschema>=4.20",
  "pydantic>=2.5",
  "tqdm>=4.66",
  "rich>=13",
  "python-dotenv>=1",
  "zhconv>=1.4.3",
]

[dependency-groups]
# The training harness needs torch and the Tinker SDK; the benchmark itself does not. `dev` includes
# `train` so a plain `uv run pytest` exercises everything with no conditional skips.
train = ["tinker>=0.36", "tinker-cookbook>=0.5.9"]
dev = ["pytest>=8", { include-group = "train" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `src/` holds the package plus the loose modules it imports (`repair_task`, `scorable`, `holdout_guard`,
# and the benchmark's own). Both are installed flat, which is the layout the imports already assume.
sources = ["src"]
include = ["story_rl", "*.py"]

[tool.uv]
# Installed, so `import story_rl` works from any script. It used to be false, and every script in
# `scripts/` carried the same two-line `sys.path.insert` to compensate — sixteen copies of one workaround,
# two of which drifted into a different idiom.
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
