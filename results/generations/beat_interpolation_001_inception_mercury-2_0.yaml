output: 'Elena trudged back to the cottage at dawn, the night’s chill still clinging
  to her coat. The map lay flat on the kitchen table, its runes dimmer now, as if
  waiting for a new decision. She heard the soft creak of the front door and turned
  to see a man in a soot‑stained apron wiping his hands on a rag. He was taller than
  she remembered, his hair a tangled mess of silver and black, eyes bright with the
  kind of curiosity that never quite rested.


  “Marcus,” she said, voice barely above a whisper, “you said the map chose me. I’m
  still sure it chose the wrong one.”


  He smiled, a thin line that revealed more amusement than reassurance. “You’re not
  the first librarian to doubt herself, Elena. I’m Marcus, keeper of curiosities and
  former wanderer of the Thornwood’s edge. I run this shop because I learned that
  knowledge can be a weapon as sharp as any blade.”


  He lifted a small wooden box from the shelf and opened it to reveal a set of thin,
  vellum‑bound cards, each stamped with a different rune. “These are reference sigils
  of the Echoes,” he explained. “When you read them aloud, they amplify the resonance
  of any place you stand. A librarian’s skill at cataloguing, at finding patterns
  in text, is exactly what you’ll need to decipher the forest’s whispers.”


  Elena’s fingers brushed the cards, and a faint pulse matched the map’s glow. “I
  catalog books, not… monsters,” she muttered, but the tremor in her voice softened.


  Marcus placed a leather‑bound notebook in her satchel. “Write what you hear, note
  the cadence of the trees. The forest tests intention; your careful eye for detail
  will keep you from being lost.”


  She stared at the notebook, at the cards, at the faint smile on Marcus’s face. The
  certainty that she was merely an ordinary tea‑maker began to fray, replaced by a
  reluctant, tentative belief that perhaps her ordinary skills could indeed be the
  key to moving forward.'
