output: 'The morning after Elena had walked out into the cold night air, she found
  herself standing outside a shop she had never noticed before. The sign above the
  door read "Marcus''s Curiosities" in letters so old they had worn smooth.


  She hadn''t meant to come here. Her feet had simply carried her through the village''s
  winding streets while her mind replayed her grandmother''s words. The map appeared
  to you, child. It chose you.


  Inside, the shop smelled of old paper, leather, and something faintly metallic.
  Shelves crammed with oddities stretched toward the ceiling: compasses that pointed
  in impossible directions, jars of something that glittered, maps of places that
  didn''t exist on any world Elena knew.


  "You''re the librarian," a voice said. Elena spun around. An elderly man stood behind
  the counter, white hair cropped short, a scar running down one cheek. His eyes held
  the particular sharpness of someone who had seen too much to be surprised by anything.


  "How did you know what I do?"


  "The map told me. In a way." He smiled, and the smile reached his eyes. "It speaks
  differently to different people. To me, it whispers. To you, I suspect it screams."


  Elena crossed her arms. "I''m not a hero. I told my grandmother last night—I''m
  ordinary. I catalog books. I make tea. That''s the extent of my useful skills."


  Marcus moved through his shop with the ease of someone who had once moved through
  more dangerous terrain. "Extraordinary things are done by ordinary people. That''s
  what makes them extraordinary. Not strength. Not magic. Knowing how to find what
  others miss."


  He pulled a worn leather satchel from beneath the counter. "This belonged to someone
  like you. Not a warrior. Not a mage. Just someone who paid attention."


  "I catalog books," Elena repeated, but her voice wavered. "That''s not—"


  "That''s knowing where things are. How they connect." Marcus pressed the satchel
  into her hands. "In the right place, that saves lives."


  Elena opened it. Inside: supplies she didn''t recognize, a brass compass, a small
  journal. "I can''t—"


  "You''re not a hero," Marcus said. "You''re something better. Unremarkable in all
  the ways that matter to people looking for heroes. But I see someone who reads voraciously,
  who notices details, who has survived by being too stubborn to give up." He paused.
  "Your grandmother believed in you. That''s enough to start."


  Elena thought of her grandmother''s ghost, the desperate hope in those translucent
  hands. The map had appeared to her. Not someone else.


  Maybe it hadn''t made a mistake.


  Maybe she had.


  She took a breath. "The forest. Thornwood. How do I get there?"


  Marcus pointed toward the door. "Follow the road to the edge of town. You''ll know
  it when you see it."


  Elena walked toward the threshold, the satchel heavy on her shoulder. She was not
  confident. She was not eager. But she was going.'
