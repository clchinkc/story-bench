output: 'The bell above Wandering Wonders chimed as Elena stepped inside, surrounded
  by shelves crammed with peculiar artifacts—crystallized thunder, bottled starlight,
  a clock that ran backward. She''d passed this shop a thousand times without entering.
  Today, her feet had carried her here unbidden.


  Marcus looked up from behind the counter, silver threading through his dark beard.
  His eyes held the particular quality of someone who had seen too much and chosen
  to stay anyway.


  "Elena Vance," he said, not a question. "I wondered when you''d find your way here."


  "I shouldn''t be here. I''m not—" She stopped, the familiar refrain catching in
  her throat.


  "Not what? A hero?" He gestured to a back room. "Come. I have something for you."


  The leather satchel was worn but sturdy, filled with supplies she didn''t recognize.
  A brass compass sat atop everything else, its face etched with symbols that seemed
  to shift when she wasn''t looking directly at them.


  "You knew my grandmother," Elena realized.


  "We traveled together, once. Before she settled into that house, before I opened
  this shop." Marcus leaned forward. "She told me about the map. And about you—the
  librarian who can read forgotten languages, who notices patterns others miss. You
  think those are small skills?"


  "I think they''re irrelevant to whatever''s out there."


  "Then you''re not looking closely enough." His voice softened. "The Wellspring doesn''t
  need another warrior. It needs someone who can understand what it''s trying to say."


  Elena''s fingers curled around the compass. Somewhere beneath her doubt, something
  shifted—a crack in the wall she''d built.


  "The forest tests intentions, not abilities," Marcus said. "Trust what you know."


  She left the shop with the satchel heavy on her shoulder, walking not toward home,
  but toward the road that led to Thornwood.'
