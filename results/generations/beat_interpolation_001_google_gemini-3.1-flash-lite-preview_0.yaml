output: "The morning air was crisp, biting at Elena’s cheeks as she ducked into the\
  \ dim, cluttered interior of \"The Gilded Relic.\" The shop smelled of ozone and\
  \ ancient parchment, an olfactory twin to the library archives she knew so well.\
  \ Marcus stood behind the counter, polishing a rusted gauntlet with a piece of rough\
  \ velvet. He didn’t look up as the bell chimed, yet his voice was steady.\n\n\"\
  I didn’t sleep,\" Elena admitted, her voice tight. \"The map is still on my table,\
  \ glowing like a fever dream. I told my grandmother I wasn't the one.\"\n\nMarcus\
  \ finally looked up, his eyes sharp beneath bushy brows. He had seen a dozen wars\
  \ and survived them all, yet he had chosen this quiet life of cataloging history.\
  \ \"The map doesn't choose the reckless, Elena. It chooses the observant.\"\n\n\"\
  I’m a librarian,\" she countered, the familiar protest spilling out. \"I categorize\
  \ reality; I don't shape it. I make tea and organize ledgers. I don't do quests.\"\
  \n\n\"Exactly,\" Marcus said, sliding a heavy brass compass across the scarred wood.\
  \ It didn't point north; the needle shivered, seeking something unseen. \"The Thornwood\
  \ is a labyrinth of shifting truths. Most adventurers rush in with steel and fire,\
  \ only to get lost in the noise. You, however, know how to find patterns in chaos.\
  \ You know how to synthesize disparate pieces of information into a coherent narrative.\
  \ That isn't just 'ordinary'—it’s the only way to survive the forest.\"\n\nElena\
  \ touched the cold metal of the compass. Her fingers trembled, not with pure terror,\
  \ but with a strange, burgeoning curiosity. She had spent her life filing away the\
  \ stories of others; perhaps it was time to read the one written for her. \n\n\"\
  I can’t promise I’ll succeed,\" she whispered.\n\n\"Good,\" Marcus replied, handing\
  \ her a worn satchel filled with supplies. \"Certainty is the first thing that dies\
  \ in the woods. Just remember: the forest tests intentions, not abilities. Trust\
  \ what you know, not what you fear you lack.\"\n\nAs she stepped back into the sunlight,\
  \ the weight of the satchel felt less like a burden and more like a tether to her\
  \ own potential. She wasn't a hero, but she was a librarian—and she knew how to\
  \ research a path."
