output: 'By morning, Elena had alphabetized an entire cart of returns at the library
  and still couldn’t stop thinking about the map breathing on her grandmother’s table
  like a patient heart. Ordinary people, she told herself, did not get chosen by glowing
  parchment. Ordinary people ignored it.


  At noon she found herself standing under the crooked sign of Marcus Vale’s Curiosity
  Shop, because if anyone in the village knew how to un-choose a person, it would
  be a retired adventurer who now sold chipped idols beside umbrella stands.


  Marcus looked up from polishing a brass instrument with too many dials. A pale scar
  crossed his jaw; his left knee stayed stiff when he moved. “You have the face of
  someone arguing with destiny,” he said.


  “I’m trying to decline,” Elena muttered, setting the map on his counter. “Formally.
  In writing, if possible.”


  He studied the runes, then her. “Thornwood. Wellspring of Echoes. Nasty route. Honest
  route.” He tapped the map. “This didn’t come to a swordsman. It came to a librarian.”


  She gave a short, humorless laugh. “Excellent. I can shush monsters to death.”


  “You can read patterns. Remember details. Keep your head when everyone else improvises
  themselves into a grave.” Marcus turned, rummaged, and assembled a worn leather
  satchel: waxed matches, bandages, a water filter, chalk, twine, a folding knife,
  two ration tins, and a brass compass whose needle spun in agitated circles before
  settling nowhere sensible. “The forest warps direction. This points to intent instead
  of north. Useful, if you’re honest with yourself.”


  Elena touched the satchel strap, feeling the weight of practical things, not prophecy.
  “And you’re coming with me?”


  Marcus snorted. “I retired for reasons involving broken bones and improved judgment.
  No. This part is yours.”


  She hated that her hands had stopped shaking. “I still think this is a terrible
  idea.”


  “The best ideas usually are at first.” He met her eyes. “Trust what you know, not
  what you fear you lack.”


  By dusk, she was packing. Reluctantly, spectacularly, going.'
