output: 'Sleep eluded Elena, so she sought the only place that smelled of old paper:
  Marcus’s curiosity shop. The bell chimed softly as she pushed open the door, finding
  the former adventurer sorting jars of dried moss in the dim light.


  Marcus looked up, eyes sharp behind wire-rimmed spectacles. "I wondered when the
  silence would catch up to you," he said, not surprised.


  "I left it," Elena said, gesturing vaguely toward home. "The map. I can''t go into
  the woods."


  "You shouldn''t come if you believe that," Marcus replied, sliding a worn leather
  satchel across the counter. Inside lay strange tools and a brass compass. "But you
  did come. That speaks louder than your words."


  "I''m just a librarian," she muttered, eyeing the compass spinning wildly. "I organize
  things, I don''t find them."


  "Precisely," Marcus nodded. "The Wellspring isn''t a destination you fight, but
  a truth you locate. You know how to decipher the obscure, how to catalogue the forgotten.
  That is not unlike following a trail that shouldn''t exist."


  Elena hesitated, fingers brushing the cold brass. "It feels like walking into a
  dark room without a light."


  "Then trust your hands," Marcus said softly. "The path reveals itself to those who
  know how to read."


  She took the satchel. It felt heavy, like responsibility. "I''ll try."


  "No trying," Marcus corrected gently. "Just walking."


  Elena stepped back into the morning air. The village lights were behind her now,
  fading as fog rolled in from the tree line. She adjusted the satchel, feeling the
  weight of the compass against her hip. The ordinary librarian stayed in the shop;
  the woman who walked into the shadows ahead was someone she barely recognized. But
  she moved forward anyway.'
