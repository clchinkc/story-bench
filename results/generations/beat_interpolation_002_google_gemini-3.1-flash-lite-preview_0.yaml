output: 'Sarah stared at the photograph of Amy. The red ink on the back felt like
  a countdown clock. She could recant. A single sentence on the witness stand—*I was
  mistaken*—and Amy would be free. It was the easy path, the one that guaranteed her
  sister’s life, but it meant letting a monster like Vincent Marchetti walk free to
  kill again. The weight of her oath as a detective pressed against her conscience,
  a suffocating counterweight to her love for her sister.


  She considered going to Captain Morrison. He was a good man, but he wasn''t invincible.
  If she told him, the bureaucracy would kick in. Internal Affairs would launch an
  investigation, and in a department riddled with Marchetti’s influence, the leak
  would be instantaneous. She couldn''t risk Amy’s life on the hope of departmental
  competence.


  Marcus Webb sat across from her, his brow furrowed. "Sarah, you look like you’ve
  seen a ghost. If this is about the Marchetti trial, we have protocols. We can get
  you protection, get Amy into a safe house. Just give me the word and I’ll take it
  to the Captain."


  Sarah looked at him, searching for the certainty she used to possess. Marcus was
  a loyal partner, but he was blind to the rot. If she brought the department in,
  Amy would be an asset to be managed, not a life to be saved. The mob didn''t play
  by the rules, and the police were too shackled by them to win.


  "I can''t, Marcus," she whispered, her voice tight. "If I go through official channels,
  I lose the only leverage I have. The moment the department knows, the clock starts
  for them, not me."


  "You''re talking like a vigilante," Marcus countered, his voice sharp with concern.
  "Don''t do something that costs you your badge."


  But as she looked at the case files on her desk—evidence that was ironclad yet vulnerable
  to the corruption within her own ranks—she realized the truth. The badge was the
  obstacle. It was the target on her back and the leash on her hands. To save Amy,
  she couldn''t be a detective anymore. She had to be something else entirely, something
  that didn''t need a warrant to act. The choice wasn''t between the law and her sister;
  it was between the law and justice. She stood up, her jaw set, and reached for her
  resignation forms.'
