output: 'By morning, Elena had slept badly enough that the runes seemed burned onto
  her eyelids. She wrapped the map in a tea towel, told herself she was only consulting
  a professional, and crossed the square to Marcus Vale''s curiosity shop.


  Marcus had traded adventuring for shopkeeping years ago, though adventure still
  clung to him. A white scar crossed one cheek, and he favored one knee when he came
  around the counter, but his eyes were bright and attentive. He unfolded the map
  without touching the glowing lines. "Wellspring of Echoes," he murmured. "Your grandmother
  never cared for small errands."


  Elena gave a humorless laugh. "If this is the part where you tell me destiny has
  excellent judgment, save it. I alphabetize folktales for a living."


  "Exactly," he said. From a shelf he took down a brass compass and set it in her
  palm. The needle spun, then trembled. "Thornwood dislikes bravado. It confuses swordsmen,
  flatters fools, and eats the overprepared. But it respects attention."


  He filled a worn leather satchel with cord, a flask, wrapped bread, a small notebook,
  and two items she could not name. "You notice patterns. You remember what belongs
  where. You know names matter, and that margins often contain the truth a page is
  trying to hide. Forests are archives, Elena. Most people blunder through them. A
  librarian might actually read one."


  She wanted to object, to insist he had mistaken competence for courage. Yet the
  distinction felt less absolute with the compass warming in her hand.


  Marcus cinched the satchel and passed it over. "I won''t come with you," he said.
  "My road goes no farther than this shop. But remember this: the forest tests intentions,
  not abilities. Trust what you know, not what you fear you lack."


  When Elena left, the bag pulled at her shoulder with a weight that felt inconveniently
  like responsibility. She still did not think herself heroic, but she turned toward
  home to pack instead of toward the door she had nearly used to run again.'
