output: 'Sunlight warmed the cobblestone path as Elena entered Marcus’s Curiosity
  Shop, the map crumpled in nervous hands. Dust motes danced around shelves crowded
  with forgotten things. Behind an oak counter, Marcus—broad-shouldered but gentle-eyed,
  his hands scarred yet precise—set down polishing cloth. "You brought the map yourself,"
  he observed softly.


  "I don’t belong on it," she confessed. "I catalogue forgotten histories. I mend
  torn pages. That’s all."


  A crinkled smile touched his lips. "And what is this journey if not a story needing
  careful reading? The Thornwood speaks in riddles and whispers. A scholar’s patience,
  an eye for detail—these matter far more than swords." He slid a worn leather satchel
  toward her. "This held my own journey. And this—" He laid a brass compass in her
  palms, its needle already humming. "It follows truth, not north."


  Elena’s throat tightened. No one had ever called her quiet skills *strength*. She
  wasn’t expected to fight. Only to listen, to understand. A fragile shift settled
  deep within.


  "Remember," Marcus said, his voice low and certain, "the Forest tests intensions,
  not abilities. Trust what you know, not what you fear you lack."


  The words didn’t erase her fear, but they rearranged it. She adjusted the satchel
  strap, its weight familiar. Not a hero’s burden, but a librarian’s. Her grandmother
  hadn’t chosen wrong. Marcus had simply helped her see why. Without another word,
  she nodded, turned, and walked out—map secure, compass steady, doubt softened into
  resolve.'
