output: 'The bell above the door of Marcus''s Curiosities & Sundries chimed as Elena
  stepped inside, still smelling of sleepless night and cold air. She hadn''t meant
  to come here. She''d meant to walk to the library, unlock the doors, and lose herself
  in the comforting monotony of the Dewey Decimal System. But her feet had carried
  her to the crooked little shop on Fenwick Lane instead, as though they knew something
  she didn''t.


  Marcus looked up from behind a counter cluttered with astrolabes and dried herbs.
  He was a broad man in his sixties, silver-bearded, with hands that had clearly known
  harder work than shopkeeping. A long scar traced the line of his jaw and disappeared
  beneath his collar.


  "You look like someone who''s seen a map she wishes she hadn''t," he said.


  Elena froze. "How did you—"


  "Sit down." He poured tea from a kettle that seemed to already be waiting. "Your
  grandmother told me this day would come. Years ago, before she passed."


  He listened without interruption as Elena described the map, the glowing runes,
  the impossible request. When she finished, she stared into her cup. "I''m not what
  it needs. I don''t have any skills that matter for something like this."


  Marcus leaned back and studied her the way someone might appraise a blade still
  unsharpened. "You''ve spent your entire adult life organizing information, recognizing
  patterns, cross-referencing sources most people can''t even read. You think that''s
  nothing?" He shook his head slowly. "The Thornwood doesn''t need a sword. It needs
  someone who pays attention. Someone who reads carefully."


  He set a worn leather satchel on the counter, then placed a brass compass beside
  it. "I walked that forest once. Nearly didn''t walk out. These helped." He pushed
  them toward her. "The compass doesn''t point north. It points toward what you''re
  meant to find."


  Elena touched the satchel''s cracked leather. Her doubt hadn''t vanished—it sat
  heavy in her chest, familiar as an old book''s weight. But beneath it, something
  quieter stirred. Not courage exactly. More like the stubborn curiosity that had
  made her a good librarian in the first place.


  "You''re not coming with me," she said. It wasn''t a question.


  "No," Marcus replied gently. "But you already knew that."


  She slung the satchel over her shoulder and stepped back into the morning light.'
