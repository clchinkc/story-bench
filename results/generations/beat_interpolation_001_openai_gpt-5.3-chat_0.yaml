output: 'Elena slept badly, the image of the glowing map needling through her dreams
  until dawn finally pushed her out of bed. She told herself she was heading for the
  market, yet somehow she turned down Crooked Lane and stopped before Marcus''s curiosity
  shop.


  Marcus was already outside, sweeping the step with the patient rhythm of someone
  who had once faced worse messes than dust.


  "You have the look of a person who argued with a magical map all night," he said
  without looking up.


  Elena froze. "I didn''t say anything about a map."


  Marcus leaned the broom against the wall and studied her with bright, infuriatingly
  calm eyes. "The runes woke you, didn''t they?"


  She sighed. "Yes. And I already refused the heroic destiny portion of the morning."


  Marcus chuckled softly. "Good. People who rush in usually get eaten."


  He disappeared inside and returned with a worn leather satchel and a brass compass.


  "Tools," he said, pressing them into her hands.


  "I don''t know how to use any of this."


  "You catalog entire worlds for a living," Marcus replied. "Patterns, languages,
  histories. Thornwood respects careful minds more than sharp swords."


  He tapped the compass. "It won''t point north. It points toward honest intention."


  Elena turned the instrument in her palm, frowning the way she did over a difficult
  index entry. "I''m still just a librarian."


  Marcus smiled. "Exactly."


  "For this journey, that may be the most useful thing you could possibly be."


  She looked down at the satchel, then back toward the road leading out of the village.
  Ordinary, she reminded herself.


  But even librarians, she supposed, occasionally followed strange references to see
  where they led.'
