output: 'The morning after her refusal, the map still glowed on her grandmother’s
  table, a silent accusation. Sleep had brought no clarity, only a deeper, hollow
  dread. Elena found herself walking the familiar cobblestone path to Marcus’s curiosity
  shop, *The Wandering Compass*, not with hope, but with a desperate need to prove
  the map was just a trick of memory, a faded fantasy.


  The shop was a cathedral of forgotten things—shelves bowed under strange instruments,
  jars of unidentifiable relics, and maps that shifted when you weren’t looking. Marcus
  himself stood behind a counter, polishing a kaleidoscope. He was a man in his sixties,
  with eyes the colour of weathered parchment and a stillness that seemed to absorb
  the shop’s clutter.


  “I know why you’re here,” he said without looking up. “The map chose you because
  you are the only one who would *see* it.”


  Elena scoffed, weakly. “I see an old piece of paper.”


  “You see patterns. Connections. You spend your life imposing order on chaos—cataloging,
  cross-referencing, finding the one correct volume on a shelf of thousands.” He set
  the kaleidoscope down and finally met her gaze. “The Thornwood doesn’t care for
  sword-swinging. It cares for intent. It feeds on fear, on unexamined paths. You
  won’t fight it. You’ll *navigate* it.”


  He reached under the counter and placed two items before her. The first was a brass
  compass, its needle quivering. “This doesn’t point north. It points to truth. Your
  truth, in that moment. Trust what you know, not what you fear you lack.” The second
  was a worn leather satchel, already half-filled with dried herbs, a blank journal,
  and a charcoal pencil. “A librarian’s tools. For recording, for remembering. The
  Wellspring of Echoes isn’t a place you conquer. It’s a place you… understand.”


  Her doubt was a physical weight. “This is madness.”


  “It’s a different kind of research,” Marcus said, a gentle finality in his voice.
  “The map chose the librarian because the quest isn’t about strength. It’s about
  attention.” He pushed the items toward her. “Take them. The forest is already waking.”


  Elena’s hands trembled as she gathered the satchel. The compass felt impossibly
  heavy. For the first time, she didn’t look at the tools as foreign objects, but
  as extensions of a self she’d always dismissed. She wasn’t being asked to become
  a hero. She was being asked to be Elena, the librarian, somewhere else. The thought
  was terrifying. And for the first time, it wasn’t entirely impossible. She turned
  to leave, the satchel a new and strange anchor on her shoulder.


  “The map’s on the table,” she stated, not a question.


  Marcus nodded, a faint smile touching his lips. “It will be waiting. As will the
  forest.”'
