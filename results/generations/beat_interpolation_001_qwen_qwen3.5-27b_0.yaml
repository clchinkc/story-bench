output: 'Morning light filtered through the dust motes of ''Oddities & Ends'' as Elena
  pushed open the bell-clanging door. She hadn''t slept; the map''s glow still burned
  behind her eyelids. An old man with a scarred cheek and eyes like polished flint
  sat behind a cluttered counter. This was Marcus. He didn''t ask why she returned.


  "You left the map," he said simply, sliding a worn leather satchel across the wood.
  "It followed you anyway."


  "I told my grandmother I''m ordinary," Elena muttered, clutching the bag''s strap.
  "I catalog books. I don''t hunt wellsprings."


  "The Wellspring doesn''t want warriors," Marcus replied, setting a brass compass
  on the counter. "It wants someone who knows how to read what isn''t written." He
  tapped the casing. "This points to truth, not north. You''ll need it."


  Elena looked at the spinning needle, then at her own hands. They were soft, stained
  with ink, not blood. "Reading isn''t enough for this."


  "Stories are power," Marcus said softly, leaning forward. "Monsters fear silence,
  but they fear a known story more. You organize the world, Elena. That is a weapon."


  She looked at the compass again. It hummed in her palm, a quiet promise against
  her skin. She didn''t feel brave. She felt terrified. But the logic of it held.
  If she could organize a chaotic archive, perhaps she could navigate a chaotic forest.


  "I don''t know how to fight," she whispered.


  "You don''t have to," Marcus said, standing. "Just know where you''re going."


  She nodded, once, the doubt still present but receding like a tide. She walked out,
  the weight of the satchel grounding her. The village lay behind her, the forest
  ahead. She wasn''t a hero yet, but she was ready to try.'
