output: 'The bell above the door of ''The Cartographer''s Corner'' chimed weakly as
  Elena pushed her way inside the next morning. The shop smelled comforting—a mixture
  of old vellum, beeswax, and pipe tobacco—but the familiarity did little to soothe
  the knot of anxiety in her stomach. Behind the counter, Marcus was meticulously
  polishing a brass sextant. His face, a roadmap of scars and sun-crinkles, looked
  up as the door closed.


  "Elena," he said, his voice a low rumble. "You look like you’ve been chased by a
  wraith. Or worse, a decision."


  She didn''t know how he knew, but Marcus always seemed to see through people. "Gran’s
  map... it woke up. It’s pointing to the Thornwood." Elena gripped the strap of her
  empty canvas bag. "It''s absurd. I’m a cataloger, Marcus. I organize fiction; I
  don''t live it."


  Marcus set the sextant down. He looked at her, not with pity, but with a disturbing
  amount of appraisal. "A cataloger," he repeated slowly. "And what is a quest, Elena,
  but the ultimate process of research? The Thornwood is just another archive, albeit
  one that moves and occasionally tries to eat you. Your patience, your ability to
  read patterns, to find order in chaos—those are the tools of survival, not swords."


  He reached under the counter and pulled out a worn leather satchel, heavy and smelling
  of oil. "I can''t go with you. My adventuring days are cataloged and shelved. But
  I can ensure you aren''t entirely useless." He slid the satchel across the wood.
  "Inside are rations, a few useful tinctures, and this." He placed a tarnished brass
  compass on top. "It doesn''t point North. It points toward what your intention seeks."


  Elena looked from the satchel to Marcus’s steady eyes. The terrifying impossibility
  of the task hadn''t changed, but her absolute refusal was cracking under the weight
  of his pragmatic confidence. She picked up the satchel. "I still think the map made
  a mistake."


  "The map sees the potential," Marcus said, returning to his work. "You only see
  the librarian."'
