output: 'By morning, Elena had convinced herself the whole thing would feel less absurd
  in daylight. It did not. The map had somehow reappeared in her satchel between a
  loaf of bread and a library ledger, glowing through the canvas with patient, infuriating
  purpose.


  That was how she found herself standing in front of Marcus Vale''s curiosity shop,
  because if anyone in the village knew how to dispose of impossible objects, it was
  the man who sold bottled lightning, cracked astrolabes, and teacups that murmured
  in dead languages.


  Marcus looked up from polishing a brass instrument when she entered. He was older
  than rumor had once allowed, broad-shouldered still, with a white scar cutting through
  one eyebrow. His gaze dropped at once to her satchel. "Ah," he said. "So it chose
  you after all."


  Elena nearly turned around. "If by chose, you mean ruined my evening, yes."


  Instead of laughing, he gestured her closer. "Your grandmother used to say you noticed
  what other people skipped past. Marginal notes. Missing pages. Patterns." He tapped
  the map when she spread it on his counter. "Thornwood is full of things that hide
  in plain sight. That sounds less like a swordsman''s work than a librarian''s."


  She gave him a flat look. "Very stirring. Shall I fend off monsters with proper
  shelving technique?"


  "If necessary, alphabetically." His mouth twitched. Then he sobered and reached
  beneath the counter, bringing out a brass compass and a worn leather satchel. "The
  compass won''t point north. It points toward what matters. The satchel has food,
  a lanternstone, bandages, and three things I suspect you don''t know how to use
  yet. Learn quickly."


  Elena stared at the gifts, then at her own hands—ordinary hands, ink-stained and
  better suited to paper cuts than peril. "You make this sound possible."


  "No," Marcus said. "I make it sound necessary. The forest tests intentions, not
  abilities. Trust what you know, not what you fear you lack."


  She hated how those words lodged somewhere tender and undeniable. When she lifted
  the compass, its needle spun, then steadied. Her pulse did much the same. Not confidence,
  exactly. But not refusal anymore.'
