output: 'The morning sun did little to chase the chill from Elena’s bones as she pushed
  open the heavy oak door of The Dusty Reliquary. The bell chimed, cutting through
  the scent of old parchment and dried sage. Behind a counter cluttered with tarnished
  astrolabes and petrified wood stood Marcus, the village’s resident purveyor of oddities—and,
  rumormongers claimed, a former adventurer.


  "You have the look of someone running from a destiny, Elena," Marcus said, his gravelly
  voice startling her. He didn''t look up from polishing a cloudy crystal.


  "I''m running from a glowing map and a persistent ghost," she muttered, tracing
  the spine of a leather-bound tome on a nearby shelf. "They want a hero. I told them
  I''m just a librarian."


  Marcus set the cloth down and fixed his piercing gray eyes on her. "And what does
  a librarian do, precisely?"


  "I organize. I preserve. I find things that are lost in the dark."


  "Exactly." Marcus reached under the counter, retrieving a worn leather satchel and
  a heavy brass compass. He set them between them. "The Thornwood doesn''t need another
  sword-swinger. It has swallowed a hundred warriors. What lies within requires someone
  who can read the patterns, who understands history, who knows how to navigate a
  labyrinth of information. The forest is just another kind of archive, Elena."


  Elena stared at the satchel. "And these?"


  "Provisions. And a compass that points to what matters, not north." Marcus slid
  them toward her. "I walked the edge of the Thornwood once. I lacked the patience
  to look closer. You don''t. You know how to observe."


  She hesitated, her fingers hovering over the scarred leather. She was still spectacularly
  ordinary, still terrified of the encroaching dark. But looking at the compass, a
  small, stubborn spark of logic ignited in her chest. *If it''s just a puzzle,* she
  thought, *I solve puzzles every day.*


  "I''m not making any promises," she said, her voice trembling only slightly as she
  pulled the satchel''s strap over her shoulder.


  "The best adventurers rarely do," Marcus smiled.'
